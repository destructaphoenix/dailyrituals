# .github/workflows/release.yml
# Releases only when the HEAD commit carries a "Release-Lane: ota|build" trailer.
# Pushes without it are no-ops (safe for WIP). See docs/superpowers/specs/2026-06-07-...
name: Release

on:
  push:
    branches: [main]

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.detect.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for the before..after diff

      - id: detect
        name: Detect Release-Lane trailer
        run: |
          LANE=$(git log -1 --pretty=%B | grep -ioP '^Release-Lane:\s*\K(ota|build)' | head -1 || true)
          echo "Detected lane: '${LANE}'"
          echo "lane=${LANE}" >> "$GITHUB_OUTPUT"

      - name: OTA native-change backstop
        if: steps.detect.outputs.lane == 'ota'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          BEFORE="$BEFORE_SHA"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER_SHA")
          echo "Changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(app\.config\.js|package\.json|package-lock\.json|eas\.json|babel\.config\.js|assets/)'; then
            echo "::error::Release-Lane is 'ota' but native-affecting files changed. Re-tag the commit as 'Release-Lane: build'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.lane != ''
        with:
          # Node 24, not 20: eas-cli 23.2.0 pulls @oclif/plugin-autocomplete@3.3.0,
          # which declares engines.node >=22, so `eas-version: latest` cannot
          # install on 20 at all (2026-09-08 — the IMP-099 OTA died here). Node 20
          # is also deprecated on GitHub runners. Keep this >=22 for as long as
          # eas-version is `latest`, which by definition moves under us.
          node-version: 24
          cache: npm

      - name: Install deps
        if: steps.detect.outputs.lane != ''
        run: npm ci

      - name: Test gate
        if: steps.detect.outputs.lane != ''
        run: npm test

  ota:
    needs: classify
    if: needs.classify.outputs.lane == 'ota'
    runs-on: ubuntu-latest
    environment: production # one-tap approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24, not 20: eas-cli 23.2.0 pulls @oclif/plugin-autocomplete@3.3.0,
          # which declares engines.node >=22, so `eas-version: latest` cannot
          # install on 20 at all (2026-09-08 — the IMP-099 OTA died here). Node 20
          # is also deprecated on GitHub runners. Keep this >=22 for as long as
          # eas-version is `latest`, which by definition moves under us.
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          # PINNED, deliberately (owner, 2026-09-08). `latest` moved to eas-cli
          # 23.2.0 whose @oclif/plugin-autocomplete wants node >=22 and broke the
          # release on a Node 20 runner — a shipping failure caused by a machine
          # we do not control moving under us. Bump this on purpose, never by
          # surprise; the Node pin above must satisfy whatever version is named.
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      # IMP-086: the OTA lane strips RC_ANDROID_KEY without --environment. See
      # otaEnvironmentPreflight in scripts/check-billing-config.js — this step is
      # what fails CI if the flag is ever dropped from the command below.
      - name: Billing preflight
        env:
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
        run: node scripts/check-billing-config.js
      # --environment production is LOAD-BEARING, not decoration. `eas update`
      # evaluates app.config.js on THIS runner, so without it process.env
      # .RC_ANDROID_KEY is undefined, extra.rcAndroidKey publishes as '', and the
      # update overwrites the key that the installed build embedded — turning
      # billing off on every device that takes the OTA. That is exactly how the
      # 2026-09-06 IMP-085 update (group d5f03a47) shipped: manifest read back
      # with rcAndroidKey:"". eas.json's profile `environment` binds the BUILD
      # lane only; it does nothing for updates.
      - name: Publish OTA
        run: |
          MSG=$(git log -1 --pretty=%s)
          eas update --branch production --environment production --message "$MSG" --non-interactive

  build:
    needs: classify
    if: needs.classify.outputs.lane == 'build'
    runs-on: ubuntu-latest
    environment: production # one-tap approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24, not 20: eas-cli 23.2.0 pulls @oclif/plugin-autocomplete@3.3.0,
          # which declares engines.node >=22, so `eas-version: latest` cannot
          # install on 20 at all (2026-09-08 — the IMP-099 OTA died here). Node 20
          # is also deprecated on GitHub runners. Keep this >=22 for as long as
          # eas-version is `latest`, which by definition moves under us.
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          # PINNED, deliberately (owner, 2026-09-08). `latest` moved to eas-cli
          # 23.2.0 whose @oclif/plugin-autocomplete wants node >=22 and broke the
          # release on a Node 20 runner — a shipping failure caused by a machine
          # we do not control moving under us. Bump this on purpose, never by
          # surprise; the Node pin above must satisfy whatever version is named.
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Write Play service account
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SA_JSON" > play-service-account.json
      # Refuses to build a paid release wired to the purchase simulation. No-op
      # while PLUS_ENABLED is false. See scripts/check-billing-config.js.
      - name: Billing preflight
        env:
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
        run: node scripts/check-billing-config.js
      # Track is set in eas.json -> submit.production.android.track ("internal").
      # Internal testing publishes in minutes and normally skips the full app
      # review that closed/open/production go through. Promote internal ->
      # production by hand in Play Console when a build is ready for the public.
      - name: Build + auto-submit to internal testing
        run: eas build -p android --profile production --auto-submit --non-interactive
