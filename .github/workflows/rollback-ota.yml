# .github/workflows/rollback-ota.yml
# Manual button (Actions tab → Run workflow) to revert the production branch's
# latest OTA. Gated behind the same approval environment.
name: Rollback OTA

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24, not 20: eas-cli 23.2.0 pulls @oclif/plugin-autocomplete@3.3.0,
          # which declares engines.node >=22, so `eas-version: latest` cannot
          # install on 20 at all (2026-09-08 — the IMP-099 OTA died here). Node 20
          # is also deprecated on GitHub runners. Keep this >=22 for as long as
          # eas-version is `latest`, which by definition moves under us.
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          # PINNED, deliberately (owner, 2026-09-08). `latest` moved to eas-cli
          # 23.2.0 whose @oclif/plugin-autocomplete wants node >=22 and broke the
          # release on a Node 20 runner — a shipping failure caused by a machine
          # we do not control moving under us. Bump this on purpose, never by
          # surprise; the Node pin above must satisfy whatever version is named.
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Roll back the production branch
        run: eas update:rollback --branch production --non-interactive
